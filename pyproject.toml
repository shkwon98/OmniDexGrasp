[project]
name = "omnidexgrasp"
version = "0.1.0"
description = "Generalizable dexterous grasping via foundation models and force feedback"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "numpy>=1.24.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "manotorch @ git+https://github.com/lixiny/manotorch.git",
    "pytorch-kinematics>=0.7.0",
    "trimesh>=4.0.0",
    "open3d>=0.17.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pycocotools>=2.0.7",
    "requests>=2.31.0",
    "viser>=0.2.0",
    "scikit-image>=0.20.0",
    "imageio>=2.31.0",
    "pyrender>=0.1.45",
    "mesh-to-sdf>=0.0.14",
    "geomloss>=0.2.0",
    "matplotlib>=3.7.0",
    "rootutils>=1.0.0",
    "ninja>=1.11.0",
    "yacs>=0.1.8",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "ipython>=8.0.0",
    "lightning-utilities>=0.11.0",
]

[project.optional-dependencies]
image-generation = [
    "google-genai>=1.0.0",
    "tenacity>=8.2.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
