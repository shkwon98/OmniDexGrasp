[project]
name = "omnidexgrasp"
version = "0.1.0"
description = "Generalizable dexterous grasping via foundation models and force feedback"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "numpy>=1.24.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "manotorch @ git+https://github.com/lixiny/manotorch.git",
    "pytorch-kinematics>=0.7.0",
    "trimesh>=4.0.0",
    "open3d>=0.17.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pycocotools>=2.0.7",
    "requests>=2.31.0",
    "viser>=0.2.0",
    "scikit-image>=0.20.0",
    "imageio>=2.31.0",
    "pyrender>=0.1.45",
    "mesh-to-sdf>=0.0.14",
    "geomloss>=0.2.0",
    "matplotlib>=3.7.0",
    "rootutils>=1.0.0",
    "ninja>=1.11.0",
    "yacs>=0.1.8",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "lightning-utilities>=0.11.0",
    "ipython>=8.0.0",
    "chumpy>=0.70",
    "deprecation>=2.1.0",
]

[dependency-groups]
dev = [
    "ipython>=8.0.0",
]

image-generation = [
    "google-genai>=1.0.0",
    "tenacity>=8.2.0",
]

dataset-download = [
    "huggingface-hub>=0.23.0,<2",
]

recons-server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
]

hamer-server = [
    { include-group = "recons-server" },
    "pip>=23",
    "setuptools<81",
    "wheel>=0.40",
    "numpy>=1.24.0,<2",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]

gsam-server = [
    { include-group = "recons-server" },
    "transformers>=4.45.0,<5",
    "supervision>=0.22.0",
    "pycocotools>=2.0.7",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
]

megapose = [
    "pandas>=1.5.0",
    "joblib>=1.2.0",
    "transforms3d>=0.4.1",
    "panda3d>=1.10.13",
    "panda3d-gltf>=1.2.0",
    "roma>=1.5.0",
    "simplejson>=3.19.0",
    "bokeh>=2.4.0",
    "webdataset>=0.2.0",
    "pypng>=0.20220715.0",
]

[tool.uv]
package = false
default-groups = []

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
